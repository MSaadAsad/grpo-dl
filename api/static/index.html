<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-2 ONNX Demo</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #f7f8fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            margin-top: 60px;
            padding: 2.5em 2em 2em 2em;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        h1 {
            color: #2d3748;
            font-size: 2em;
            margin-bottom: 0.5em;
            text-align: center;
        }
        label {
            font-weight: 700;
            color: #4a5568;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 0.7em;
            margin-top: 0.3em;
            margin-bottom: 1.2em;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1em;
            background: #f9fafb;
            transition: border 0.2s;
        }
        select:focus, input[type="text"]:focus {
            border: 1.5px solid #3182ce;
            outline: none;
        }
        button {
            width: 100%;
            padding: 0.8em;
            background: linear-gradient(90deg, #667eea 0%, #5a67d8 100%);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #5a67d8 0%, #667eea 100%);
        }
        #output {
            margin-top: 1.5em;
            padding: 1.2em;
            border-radius: 10px;
            background: #edf2f7;
            color: #2d3748;
            min-height: 2em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPT-2 ONNX Demo</h1>
        <form id="gen-form">
            <label for="model">Model:</label>
            <select id="model" name="model">
                <option value="gpt-2-vanilla">gpt-2-vanilla</option>
                <option value="gpt-2-ppo">gpt-2-ppo</option>
                <option value="gpt-grpo">gpt-grpo</option>
            </select>
            <label for="prompt">Prompt:</label>
            <input type="text" id="prompt" name="prompt" placeholder="Enter your prompt..." required>
            <button type="submit">Generate</button>
        </form>
        <div id="output"></div>
    </div>
    <script>
    document.getElementById('gen-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const prompt = document.getElementById('prompt').value;
        const model = document.getElementById('model').value;
        document.getElementById('output').innerText = 'Generating...';
        const response = await fetch('/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': '' }, // Insert API key if needed
            body: JSON.stringify({ prompt, model })
        });
        if (response.ok) {
            const data = await response.json();
            document.getElementById('output').innerText = data.output;
        } else {
            document.getElementById('output').innerText = 'Error: ' + response.statusText;
        }
    });
    </script>
</body>
</html>
